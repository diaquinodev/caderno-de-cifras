name: segredos

on: [push, pull_request]

permissions:
  contents: read
  pull-requests: read  # o gitleaks lista os commits do PR pela API

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0  # a ação varre os commits novos de cada push/PR; o histórico
          # inteiro é varrido uma vez, localmente, antes de tornar o repo público

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
